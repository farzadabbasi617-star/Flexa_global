name: Telegram automation cron

on:
  schedule:
    # Every 30 minutes, NOT every 5.
    #
    # Neon suspends an idle compute after 5 minutes (scale to zero). A cron on
    # a 5-minute interval lands exactly on that boundary, so the database was
    # re-woken the moment before it could sleep and stayed up ~82% of the month
    # (435 active hours out of 527 elapsed). That burned the free plan's
    # 100 CU-hour allowance by 22 August and suspended the whole project:
    # site down, no logins, no payments.
    #
    # At 30 minutes the compute genuinely sleeps between runs, which drops
    # usage to roughly 25-35 hours a month. Nothing in this job needs
    # 5-minute precision -- the tightest consumer is tournament reminders,
    # which are hour-scale.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-automation-cron
  cancel-in-progress: true

jobs:
  run:
    name: Run Gament scheduled automation
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Call protected production cron
        env:
          CRON_SECRET: ${{ secrets.TELEGRAM_CRON_SECRET }}
          CRON_URL: ${{ secrets.TELEGRAM_CRON_URL }}
        run: |
          test -n "$CRON_SECRET" || { echo "TELEGRAM_CRON_SECRET repository secret is missing"; exit 1; }
          test -n "$CRON_URL" || { echo "TELEGRAM_CRON_URL repository secret is missing"; exit 1; }
          case "$CRON_URL" in https://*.onrender.com/api/telegram/cron) ;; *) echo "TELEGRAM_CRON_URL must be the Render origin cron URL"; exit 1;; esac
          status="$(curl --silent --show-error \
            --retry 2 --retry-all-errors --max-time 150 \
            -o /tmp/gament-cron-response.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Accept: application/json" \
            -H "User-Agent: Gament-GitHub-Cron/1.0" \
            "$CRON_URL")"
          if [ "$status" != "200" ]; then
            echo "Gament cron returned HTTP $status"
            head -c 1000 /tmp/gament-cron-response.json
            exit 1
          fi
          jq -e '.ok == true' /tmp/gament-cron-response.json >/dev/null
          echo "Gament cron completed successfully"
          echo "Gaming news result:"
          jq -c '.dailyGamingNews' /tmp/gament-cron-response.json
